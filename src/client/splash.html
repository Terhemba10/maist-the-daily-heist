<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="splash.css" />
    <title>Maist: The Daily Heist</title>
  </head>
  <body>
    <main class="splash">
      <p class="kicker" id="night">MAIST</p>
      <h1 class="logo">The Daily Heist</h1>
      <p class="tag">Sneak your crew past the bots. Crack 3 vaults.</p>
      <div class="scene" aria-hidden="true">
        <div class="floor"></div>
        <div class="beam"></div>
        <span class="a guard" data-art="guard"></span>
        <b class="zzz">Zzz</b>
        <span class="a vault" data-art="vault"></span>
        <span class="a oto" data-art="oto"></span>
        <span class="a wren" data-art="wren"></span>
        <span class="a vale" data-art="vale"></span>
      </div>
      <p class="crews" id="crews"></p>
      <p class="status" id="status"></p>
      <button class="go" id="go" type="button">Start the heist</button>
      <p class="who" id="who"></p>
      <p class="who" id="countdown"></p>
    </main>
    <script type="module" src="splash.ts"></script>
  </body>
</html>
