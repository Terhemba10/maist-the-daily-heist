<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="splash.css" />
    <title>Maist: The Daily Heist</title>
  </head>
  <body>
    <main class="splash">
      <p class="kicker" id="night">MAIST</p>
      <h1 class="logo">The Daily Heist</h1>
      <p class="tag">Three dream layers · one shared AP pool · new maps every day</p>
      <div class="crew" aria-hidden="true"><span class="c0">◆</span><span class="c1">◐</span><span class="c2">✦</span><span class="g">◇</span><span class="v">◈</span></div>
      <p class="status" id="status"></p>
      <button class="go" id="go" type="button">Start the heist</button>
      <p class="who" id="who"></p>
      <p class="who" id="countdown"></p>
    </main>
    <script type="module" src="splash.ts"></script>
  </body>
</html>
